<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mr. Top's English Class</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <main class="landing">
    <section class="hero card">
      <h1 class="welcome-title"><span>Welcome to</span><strong>Mr. Top's</strong><span>English Class</span></h1>
      <h2>Login to Your Student Account</h2>
      <form id="studentLoginForm" class="student-login-form">
        <label for="loginProgram">Program</label>
        <select id="loginProgram" required><option value="">Select program</option></select>
        <label for="loginClass">Class</label>
        <select id="loginClass" required><option value="">Select class</option></select>
        <label for="loginName">Name</label>
        <select id="loginName" required><option value="">Select your name</option></select>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <label class="remember-device"><input id="rememberDevice" type="checkbox"> Remember this device</label>
        <button class="btn primary full" type="submit">Login</button>
        <p id="studentLoginStatus" class="form-error" role="status"></p>
      </form>
      <form id="studentSetupForm" class="student-login-form hidden">
        <h3>Create Your Password</h3>
        <input id="setupProgram" type="hidden">
        <input id="setupClass" type="hidden">
        <input id="setupName" type="hidden">
        <label for="setupPassword">New password</label>
        <input id="setupPassword" type="password" minlength="3" required>
        <label for="setupPasswordConfirm">Confirm password</label>
        <input id="setupPasswordConfirm" type="password" minlength="3" required>
        <button class="btn primary full" type="submit">Create Password and Login</button>
        <p id="studentSetupStatus" class="form-error" role="status"></p>
      </form>
    </section>
    <a href="admin.html" class="btn secondary small home-admin-button">Admin Panel</a>
  </main>
  <script src="cloud-storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
